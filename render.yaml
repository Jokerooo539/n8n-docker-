# Deploys n8n on Render using the official Docker image,
# connected to an external Postgres database (Supabase)
# instead of a Render-managed database.
#
# Two values below are marked `sync: false` — Render will
# prompt you to enter these in the dashboard when you apply
# this Blueprint, rather than storing them in this file. Do
# NOT replace `sync: false` with the real values here if this
# repo (or your fork of it) is public.

services:
  - type: web
    plan: free
    # Runtime for services that pull a prebuilt Docker image
    runtime: image
    name: n8n-service
    image:
      # Pulls the official n8n image tagged as latest from Docker Hub
      url: docker.io/n8nio/n8n:latest
    envVars:
      # Generates a base64-encoded key for encrypting credentials in n8n.
      # Do not modify this value after it's generated, or you'll lose
      # access to all credentials encrypted with the previous value.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # --- Database: external Postgres (Supabase Session Pooler) ---
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: postgres.fxzuaasradtrbqmghayk
      - key: DB_POSTGRESDB_PASSWORD
        sync:false
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # --- Basic auth ---
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin_539
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # --- Timezone ---
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: TZ
        value: Asia/Kolkata

      # --- Logging & diagnostics ---
      - key: N8N_LOG_LEVEL
        value: info
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

      # --- Security hardening ---
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"

      # --- Execution data (avoid unbounded DB growth) ---
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "336"

# No `databases:` block — we're using your existing Supabase
# Postgres instead of provisioning a new Render-managed one.
